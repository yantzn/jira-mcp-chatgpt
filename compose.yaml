services:
  jira-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: personal-jira-mcp:local
    environment:
      JIRA_BASE_URL: ${JIRA_BASE_URL}
      JIRA_EMAIL: ${JIRA_EMAIL}
      JIRA_DEFAULT_PROJECT_KEY: ${JIRA_DEFAULT_PROJECT_KEY:-}
      HOST: 0.0.0.0
      PORT: 8787
      JIRA_API_TOKEN_FILE: /run/secrets/jira-api-token
      MCP_AUTHORIZATION_HEADER_FILE: /run/secrets/mcp-authorization-header
    secrets:
      - jira-api-token
      - mcp-authorization-header
    ports:
      - "${MCP_BIND_ADDRESS:-127.0.0.1}:${PORT:-8787}:8787"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - private-mcp

  tunnel-client:
    image: ghcr.io/openai/tunnel-client:v0.0.16
    environment:
      CONTROL_PLANE_API_KEY: file:/run/secrets/control-plane-api-key
      CONTROL_PLANE_TUNNEL_ID: ${CONTROL_PLANE_TUNNEL_ID}
      MCP_SERVER_URL: http://jira-mcp:8787/mcp
      MCP_EXTRA_HEADERS: "Authorization: file:/run/secrets/mcp-authorization-header"
      MCP_STARTUP_WAIT_TIMEOUT: 60s
      LOG_LEVEL: info
      LOG_FORMAT: json
      HEALTH_LISTEN_ADDR: 127.0.0.1:8080
    secrets:
      - control-plane-api-key
      - mcp-authorization-header
    depends_on:
      jira-mcp:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/readyz
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - private-mcp
      - tunnel-egress

networks:
  private-mcp:
    driver: bridge
    internal: true
  tunnel-egress:
    driver: bridge

secrets:
  jira-api-token:
    file: ./.secrets/jira-api-token
  control-plane-api-key:
    file: ./.secrets/control-plane-api-key
  mcp-authorization-header:
    file: ./.secrets/mcp-authorization-header
